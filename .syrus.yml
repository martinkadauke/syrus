# Syrus's own .syrus.yml — picked up by Steps::Prepare in any
# workflow run against this repo (Initial / Replay / PrFeedback /
# CiFailure). The agent skips the dependency-install dance that
# tripped earlier runs (Job 166: ~25 turns spent figuring out how
# to make `bin/rspec` work because gems weren't installed).

prepare:
  # The agent's env strips BUNDLE_PATH (per Steps::Prepare's
  # PREP_ENV_FORWARD allowlist), but bundler defaults to a global
  # location otherwise. Pin install location to the workspace's
  # `vendor/bundle/` via a workspace-local `.bundle/config` so
  # `bin/rspec`, `bundle exec rails test`, etc. all resolve gems
  # the agent just installed.
  - bundle config set --local path vendor/bundle
  - bundle install --jobs 4

# Each grader's `description:` is surfaced in the UI (tooltip on the
# grader name + above the output panel on failure) and prepended to
# the per-grader block in the agent's grade-failure prompt. Authoring
# guidance: lead with what the grader rejects (so the agent knows what
# shape "passing" looks like), then mention the prod failure mode the
# check exists to prevent. Keep it 2-4 sentences; the surfaces this
# renders into don't have room for paragraphs.
grade:
  - name: migration-collisions
    description: |
      Rejects migrations whose YYYYMMDDHHMMSS timestamps collide with
      main or with each other. Hand-rolled timestamps silently corrupt
      dev DBs (db:migrate skips colliding versions) and crash production
      deploys with "table already exists." Always create migrations
      via `bin/rails generate migration <Name>` so the timestamp is
      fresh at file-creation time.
    run: bin/check-migration-collisions
    timeout_minutes: 1

  - name: migration-lint
    description: |
      Catches non-idempotent migration patterns (bare `add_column`,
      `remove_column`, `add_reference`, `add_index` without
      `_exists?` guards) and MySQL-8 JSON-default footguns on
      migrations touched by this branch. Production deploys retry
      partial migrations; without guards the retry crashes with
      "Duplicate column" or "table already exists."
    run: bin/check-migrations
    timeout_minutes: 1

  - name: thread-budget
    description: |
      Rejects a SolidQueue worker config whose thread budget exceeds
      the DB connection pool. Mismatch crashloops the worker pod at
      boot — it can't claim a connection per thread. Bump
      RAILS_MAX_THREADS / config/database.yml's pool, or trim the
      queue's thread count.
    run: bin/check-thread-budget
    timeout_minutes: 1

  - name: eager-load
    description: |
      Forces Rails.application.eager_load! to surface Zeitwerk
      duplicate-class / namespace-mismatch errors that lazy autoload
      in dev/test hides. These crashes only fire at production boot
      (when config.eager_load = true), so without this check they
      detonate live pods. If this fails, two files probably define
      the same constant with different superclasses — check umbrella
      files vs per-class siblings.
    run: bin/check-eager-load
    timeout_minutes: 1

  - name: turbo-defaults
    description: |
      Rejects turbo_frame_tag calls without an explicit `target:`.
      Without a target, in-frame links that target the frame but
      receive a response without the same frame ID render as
      "Content missing." Every turbo_frame_tag should pass
      `target: "_top"` unless the frame is hosting in-place
      navigation.
    run: bin/check-turbo-defaults
    timeout_minutes: 1

  - name: rspec
    description: |
      Full RSpec suite. CLAUDE.md "Tests are not optional" is the
      rule; this grader is the enforcement. New behavior needs new
      specs; bug fixes need regression specs; refactors must keep
      the suite green and add coverage to any under-tested area
      they touch. `db:test:prepare` runs first so schema changes in
      the same workflow are picked up before spec collection.
    run: bin/rails db:test:prepare && bin/rspec
    timeout_minutes: 10

  - name: js-tests
    description: |
      JS controller specs via `node --test` (no Rails boot, no
      bundler). Separated from the rspec grader so a broken
      Stimulus controller reports as "js-tests failed" instead of
      hiding under a generic "rspec failed." Usually ~100ms.
    run: bin/test-js
    timeout_minutes: 1
