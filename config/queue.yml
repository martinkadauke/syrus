default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Long-running RunJobs (agent invocations, ~5-10 min each)
    # get their own worker so they can't starve maintenance and
    # broadcast work. JOB_CONCURRENCY caps the simultaneous agent
    # invocations system-wide.
    - queues: "runs"
      threads: <%= ENV.fetch("JOB_CONCURRENCY", 3) %>
      processes: 1
      polling_interval: 0.1
    # Deterministic landing and merge work runs outside the agent
    # pool so quick non-agentic steps do not consume Claude slots.
    - queues: "merges"
      threads: <%= ENV.fetch("MERGE_CONCURRENCY", 5) %>
      processes: 1
      polling_interval: 0.1
    # User-facing chat turns and chat workspace maintenance get a
    # separate low-concurrency pool. They may invoke agents too, but
    # must not sit behind saturated multi-hour RunJobs.
    - queues: "chat"
      threads: <%= ENV.fetch("CHAT_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.1
    # Walkthrough-video analysis pins a thread for many minutes
    # (500MB streamed Gemini upload + ACTIVE polling + a long
    # generateContent). Isolated so a few simultaneous analyses
    # can't starve pollers, reapers, or app-event broadcasts.
    - queues: "videos"
      threads: <%= ENV.fetch("VIDEO_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 0.5
    # Everything else — recurring reapers / pollers, app-event
    # broadcasts, prune jobs. All short-lived; sharing a small
    # thread pool is fine. Critically, this worker is independent
    # of the RunJob worker, so a saturated agent pool can't make
    # the UI feel frozen by holding back broadcast deliveries.
    - queues: "default"
      threads: 3
      processes: 1
      polling_interval: 0.1

development:
  dispatchers:
    - polling_interval: 1
      batch_size: 100
  workers:
    # SQLite has a single writer. Keep the production queue separation,
    # but avoid the high local thread fanout that can wedge the dev queue DB.
    - queues: "runs"
      threads: <%= ENV.fetch("DEV_RUN_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "merges"
      threads: <%= ENV.fetch("DEV_MERGE_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "chat"
      threads: <%= ENV.fetch("DEV_CHAT_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "videos"
      threads: <%= ENV.fetch("DEV_VIDEO_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5
    - queues: "default"
      threads: <%= ENV.fetch("DEV_DEFAULT_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 0.5

test:
  <<: *default

production:
  <<: *default
