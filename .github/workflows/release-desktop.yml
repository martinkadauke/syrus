# Builds, signs, notarizes, and publishes the Syrus desktop apps on every
# v* tag: macOS (Developer ID + notarytool) then Windows (Azure Trusted
# Signing). See docs/releasing.md for the runbook and secret inventory, and
# docs/release-troubleshooting.md when a run goes red. A workflow_dispatch
# run exercises the pipeline unsigned and publishes nothing.
#
# Hardening notes (the why behind the shape):
# - Credential PREFLIGHTS run before any expensive build so a bad secret
#   fails in seconds, not after 15 minutes of packaging.
# - forceCodeSigning is passed as a CI-only override: electron-builder's
#   default on a missing/787-broken cert is to log "skipped ... code
#   signing" and ship an UNSIGNED artifact. Locally that's the desired dev
#   behavior, in a release it would strand the installed base, so CI turns
#   it into a hard failure.
# - Notarization is the flakiest step (opaque transient failures that
#   succeed on resubmit): the build step retries ONCE, but never when the
#   verdict was a deterministic "Invalid" — and on failure the notarytool
#   developer log (the actual reasons) is fetched and uploaded as an
#   artifact.
# - The windows job runs AFTER the mac job on purpose: both publish into
#   the same GitHub release, and concurrent create-release calls race into
#   422s. Windows also hard-requires signing — never publish unsigned.
# - stapler validate runs against the .app, NOT the DMG: electron-builder
#   staples the notarization ticket to the app bundle; the DMG container
#   itself carries no ticket (validating it fails with Error 65 by design).
name: Release desktop app

on:
  push:
    tags: ["v*"]
  # Any workflow_dispatch run is an unsigned, publish-nothing pipeline test;
  # only v* tag pushes build, sign, and publish.
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time; never cancel a half-published release.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-mac:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # The tag name is attacker-influenceable for anyone with tag-push
      # access; it reaches shell only via env, never inline interpolation.
      - name: "Guard: package.json version matches the tag"
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./desktop/package.json').version")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error::desktop/package.json version ($PKG_VERSION) does not match the tag ($VERSION). Bump the version, merge, then tag."
            exit 1
          fi

      # Enforces the release ordering: bin/publish-image X.Y.Z --multi-arch
      # runs (and gates on bin/test-docker) BEFORE the tag is pushed. The
      # DMG's bundled installer pins this exact image tag.
      - name: "Guard: backend image tag exists on GHCR"
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:tkadauke/syrus-local:pull" | jq -r .token)
          if ! curl -fsSL -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/tkadauke/syrus-local/manifests/$VERSION"; then
            echo "::error::ghcr.io/tkadauke/syrus-local:$VERSION not found (or the package is private). Run bin/publish-image $VERSION --multi-arch first and make the package public."
            exit 1
          fi

      # Never publish an unsigned release: Gatekeeper blocks it for users and
      # Squirrel.Mac refuses to auto-update into it, stranding the installed base.
      - name: "Guard: signing secrets present"
        if: github.ref_type == 'tag'
        run: |
          if [[ -z "${{ secrets.CSC_LINK }}" || -z "${{ secrets.APPLE_API_KEY_P8 }}" ]]; then
            echo "::error::Signing secrets missing (CSC_LINK / APPLE_API_KEY_P8). Refusing to publish an unsigned release."
            exit 1
          fi

      # Catch bad Apple credentials in seconds, before the 15-minute build:
      # decode the p12 (catches truncated/whitespace-mangled base64), check
      # the password, require the "Developer ID Application" type (an
      # "Apple Development" cert signs fine and then FAILS notarization on
      # every binary — see docs/release-troubleshooting.md), refuse
      # soon-expiring certs, and prove the notary API key works with a
      # cheap authenticated call.
      - name: "Preflight: Apple signing credentials"
        if: github.ref_type == 'tag'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/preflight.p12"
          PEM="$RUNNER_TEMP/preflight.pem"
          if ! printf '%s' "$CSC_LINK" | base64 -d > "$P12" 2>/dev/null; then
            echo "::error::CSC_LINK is not valid base64 — re-export with: base64 -i cert.p12 (single line, no wrapping)."
            exit 1
          fi
          # OpenSSL 3 needs -legacy for Keychain's 3DES exports; try both.
          if ! openssl pkcs12 -in "$P12" -nokeys -passin env:CSC_KEY_PASSWORD -out "$PEM" 2>/dev/null; then
            if ! openssl pkcs12 -in "$P12" -nokeys -legacy -passin env:CSC_KEY_PASSWORD -out "$PEM" 2>/dev/null; then
              echo "::error::Could not open the p12 with CSC_KEY_PASSWORD — wrong password or corrupted p12."
              exit 1
            fi
          fi
          SUBJECT=$(openssl x509 -in "$PEM" -noout -subject)
          echo "cert subject: $SUBJECT"
          if ! grep -q "Developer ID Application" <<<"$SUBJECT"; then
            echo "::error::CSC_LINK is not a 'Developer ID Application' certificate ($SUBJECT). Apple Development / Apple Distribution certs sign locally but FAIL notarization."
            exit 1
          fi
          if ! openssl x509 -in "$PEM" -noout -checkend 0; then
            echo "::error::The Developer ID certificate has EXPIRED. Create a new one (developer.apple.com -> Certificates) and update CSC_LINK/CSC_KEY_PASSWORD."
            exit 1
          fi
          if ! openssl x509 -in "$PEM" -noout -checkend 2592000; then
            echo "::warning::The Developer ID certificate expires within 30 days — rotate CSC_LINK soon."
          fi
          rm -f "$P12" "$PEM"
          # Shape checks catch swapped key-id/issuer secrets (10-char id vs UUID issuer).
          if [[ ! "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_API_KEY_ID doesn't look like a 10-character key id — is it swapped with APPLE_API_ISSUER?"
            exit 1
          fi
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::APPLE_API_ISSUER doesn't look like a UUID — is it swapped with APPLE_API_KEY_ID?"
            exit 1
          fi
          KEY="$RUNNER_TEMP/preflight_key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY"
          if ! xcrun notarytool history --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json > /dev/null; then
            echo "::error::notarytool rejected the App Store Connect API key (APPLE_API_KEY_P8 / _ID / _ISSUER). The key must be a TEAM key with the Developer role."
            exit 1
          fi
          rm -f "$KEY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix desktop

      - name: Write App Store Connect API key
        if: github.ref_type == 'tag'
        run: printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" > "$RUNNER_TEMP/apple_api_key.p8"

      # forceCodeSigning turns electron-builder's silent skip-signing paths
      # into hard failures — CI-only so local dev builds stay unsigned.
      # One retry, but never on a deterministic notarization "Invalid"
      # verdict (that needs a code fix, not a resubmit).
      - name: Build, sign, notarize, and publish
        if: github.ref_type == 'tag'
        timeout-minutes: 60
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYRUS_RELEASE_BUILD: "1"
        run: |
          set -o pipefail
          build() {
            npm --prefix desktop run build -- --publish always -c.forceCodeSigning=true 2>&1 | tee "$RUNNER_TEMP/build.log"
          }
          if build; then
            exit 0
          fi
          if grep -q '"status":"Invalid"\|status: Invalid' "$RUNNER_TEMP/build.log"; then
            echo "::error::Notarization verdict was Invalid — deterministic, not retrying. The developer log artifact has the per-binary reasons."
            exit 1
          fi
          echo "::warning::Build/notarization failed with a non-deterministic error — retrying once in 90s."
          sleep 90
          build

      # An Invalid verdict prints only "Processing complete"; the actual
      # reasons live in the notary developer log. Fetch it by submission id
      # and attach it to the run.
      - name: Fetch notarytool developer log
        if: failure() && github.ref_type == 'tag'
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # @electron/notarize submits with --output-format json, so the
          # failure message it embeds in the build log carries `"id":"<uuid>"`
          # — never the unquoted `id: <uuid>` (that's a DEBUG-only line).
          ID=$(grep -oE '"id"[[:space:]]*:[[:space:]]*"[0-9a-f-]{36}"' "$RUNNER_TEMP/build.log" | tail -1 | grep -oE '[0-9a-f-]{36}') || true
          if [[ -n "${ID:-}" ]]; then
            xcrun notarytool log "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" "$RUNNER_TEMP/notary_developer_log.json" || true
          fi
          cp "$RUNNER_TEMP/build.log" . 2>/dev/null || true
          cp "$RUNNER_TEMP/notary_developer_log.json" . 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure() && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-diagnostics
          path: |
            build.log
            notary_developer_log.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Build unsigned (dry run)
        if: github.ref_type != 'tag'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix desktop run build -- --publish never

      # stapler runs against the .app — the DMG container has no ticket of
      # its own (Error 65 there is expected, not a failure).
      - name: Verify signature, notarization, and update feed
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for APP in desktop/out/mac-arm64/Syrus.app desktop/out/mac/Syrus.app; do
            codesign --verify --deep --strict "$APP"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep "Developer ID Application"
            spctl -a -t exec -vv "$APP" 2>&1 | grep "Notarized Developer ID"
            xcrun stapler validate "$APP"
          done
          # electron-updater's invariant: the feed file and BOTH zips must
          # exist, or installed apps stop updating.
          test -f desktop/out/latest-mac.yml
          grep -q "Syrus-$VERSION-arm64.zip" desktop/out/latest-mac.yml
          test -f "desktop/out/Syrus-$VERSION-arm64.zip"
          test -f "desktop/out/Syrus-$VERSION-x64.zip"

      # Unversioned copies of both DMGs so the website can permalink
      # https://github.com/tkadauke/syrus/releases/latest/download/Syrus.dmg
      # (Apple Silicon) and .../Syrus-Intel.dmg (Intel Macs).
      - name: Upload stable-named DMG aliases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "desktop/out/Syrus-$VERSION-arm64.dmg" "$RUNNER_TEMP/Syrus.dmg"
          cp "desktop/out/Syrus-$VERSION-x64.dmg" "$RUNNER_TEMP/Syrus-Intel.dmg"
          gh release upload "v$VERSION" "$RUNNER_TEMP/Syrus.dmg" "$RUNNER_TEMP/Syrus-Intel.dmg" --clobber

  # Runs after the mac job on purpose: both jobs publish into the same
  # GitHub release, and concurrent create-release calls race into 422s.
  # Signing is REQUIRED — an unsigned Windows artifact never ships (see
  # docs/windows-signing.md; sign-windows-test.yml is the place to prove
  # the Azure setup before a release depends on it).
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: release-mac
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: "Guard: Azure signing configuration present"
        if: github.ref_type == 'tag'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT || vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT_NAME: ${{ secrets.AZURE_SIGN_ACCOUNT_NAME || vars.AZURE_SIGN_ACCOUNT_NAME }}
          AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE || vars.AZURE_SIGN_CERT_PROFILE }}
          AZURE_SIGN_PUBLISHER_NAME: ${{ secrets.AZURE_SIGN_PUBLISHER_NAME || vars.AZURE_SIGN_PUBLISHER_NAME }}
        run: |
          missing=()
          for var in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT_NAME AZURE_SIGN_CERT_PROFILE AZURE_SIGN_PUBLISHER_NAME; do
            if [ -z "${!var}" ]; then missing+=("$var"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Azure signing configuration missing: ${missing[*]} — see docs/windows-signing.md. Refusing to publish an unsigned Windows release."
            exit 1
          fi

      # Prove tenant/client/secret against the code-signing resource in
      # seconds — a 401 here is a credential problem; a 403 later at sign
      # time is a role/profile problem (different fixes, see the runbook).
      - name: "Preflight: Azure credentials"
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $body = @{
            grant_type    = "client_credentials"
            client_id     = $env:AZURE_CLIENT_ID
            client_secret = $env:AZURE_CLIENT_SECRET
            scope         = "https://codesigning.azure.net/.default"
          }
          try {
            $null = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$($env:AZURE_TENANT_ID)/oauth2/v2.0/token" -Body $body
            Write-Host "Azure token acquisition OK"
          } catch {
            Write-Host "::error::Azure credential preflight failed: $($_.Exception.Message). Check AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET (the app registration must be single-tenant; secrets expire)."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix desktop

      # electron-builder installs the TrustedSigning PowerShell module on
      # first use; doing it here once (with retries) dodges both transient
      # gallery failures and the concurrent-install race between parallel
      # sign invocations.
      - name: "Preflight: TrustedSigning module"
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $attempts = 0
          while ($true) {
            try {
              Install-Module -Name TrustedSigning -Force -Scope CurrentUser -ErrorAction Stop
              break
            } catch {
              $attempts += 1
              if ($attempts -ge 3) { Write-Host "::error::Could not install the TrustedSigning module: $($_.Exception.Message)"; exit 1 }
              Start-Sleep -Seconds 20
            }
          }

      - name: Build, sign, and publish
        if: github.ref_type == 'tag'
        timeout-minutes: 45
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT || vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT_NAME: ${{ secrets.AZURE_SIGN_ACCOUNT_NAME || vars.AZURE_SIGN_ACCOUNT_NAME }}
          AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE || vars.AZURE_SIGN_CERT_PROFILE }}
          AZURE_SIGN_PUBLISHER_NAME: ${{ secrets.AZURE_SIGN_PUBLISHER_NAME || vars.AZURE_SIGN_PUBLISHER_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYRUS_RELEASE_BUILD: "1"
        run: |
          # Normalize the endpoint: the portal shows it with a trailing
          # slash, Invoke-TrustedSigning wants the bare origin.
          AZURE_SIGN_ENDPOINT="${AZURE_SIGN_ENDPOINT%/}"
          npm --prefix desktop run build -- --win --publish always \
            -c.forceCodeSigning=true \
            "-c.win.azureSignOptions.publisherName=${AZURE_SIGN_PUBLISHER_NAME}" \
            "-c.win.azureSignOptions.endpoint=${AZURE_SIGN_ENDPOINT}" \
            "-c.win.azureSignOptions.certificateProfileName=${AZURE_SIGN_CERT_PROFILE}" \
            "-c.win.azureSignOptions.codeSigningAccountName=${AZURE_SIGN_ACCOUNT_NAME}"

      - name: Build unsigned (dry run)
        if: github.ref_type != 'tag'
        run: npm --prefix desktop run build -- --win --publish never

      - name: Verify signatures and update feed
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exes = Get-ChildItem -Path desktop/out -Filter "Syrus-Setup-*.exe"
          if ($exes.Count -eq 0) { throw "No Syrus-Setup-*.exe artifacts found under desktop/out" }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne "Valid") { throw "$($exe.Name) is not validly signed (status: $($sig.Status))" }
          }
          # electron-updater's Windows feed.
          if (-not (Test-Path "desktop/out/latest.yml")) { throw "latest.yml missing - Windows auto-update feed would be broken" }

      # Stable aliases for the website: .../releases/latest/download/Syrus-Setup.exe
      - name: Upload stable-named installer aliases
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "desktop/out/Syrus-Setup-$VERSION-x64.exe" "$RUNNER_TEMP/Syrus-Setup.exe"
          cp "desktop/out/Syrus-Setup-$VERSION-arm64.exe" "$RUNNER_TEMP/Syrus-Setup-arm64.exe"
          gh release upload "v$VERSION" "$RUNNER_TEMP/Syrus-Setup.exe" "$RUNNER_TEMP/Syrus-Setup-arm64.exe" --clobber
