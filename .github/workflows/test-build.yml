# A TEST BUILD: deterministically build every shippable component from any
# ref — the backend image is PUSHED to GHCR under a collision-proof test tag,
# and the signed macOS DMG + Windows installer are built with that exact tag
# manifested in — while making publishing structurally impossible.
#
# How it differs from release.yml (deliberately a sibling file — release.yml's
# text is pinned by spec/desktop/auto_update_spec.rb and
# spec/scripts/docker_image_scripts_spec.rb, so it is not refactored into a
# reusable workflow):
#
# - `permissions: contents: read` — this workflow CANNOT create a git tag or a
#   GitHub Release even if a step tried. The only write scope is `packages`
#   (the test image push).
# - The backend image is ALWAYS pushed, as ghcr.io/tkadauke/syrus-backend:
#   test-<short-sha> — never a semver tag, never `:latest` (guarded in
#   `prepare`). A test tag can therefore never collide with or shadow a
#   release tag.
# - The desktop apps are versioned `X.Y.Z-test.<run-number>` (the next patch
#   over the same tag/package.json base release.yml uses) so a test build can
#   never be mistaken for a release. Auto-update is disarmed in BOTH
#   directions: release installs never see a test build (nothing here stages
#   or publishes feed files), and test installs never self-replace —
#   appUpdates.ts skips auto-update for `-test.` versions, because the
#   baked-in GitHub feed plus semver ordering (X.Y.Z-test.N < X.Y.Z) would
#   otherwise swap a pinned evaluation for the next published release.
# - Desktop jobs run AFTER merge-backend: by the time a DMG/installer exists,
#   the image tag pinned inside its manifest.json is verifiably pulled-able.
# - Artifacts land on the WORKFLOW RUN (test-staged-mac / test-staged-windows /
#   test-staged-cli, 14 days), not in a GitHub Release, and there are no
#   stable-name aliases (Syrus.dmg / Syrus-Setup.exe imply the website
#   permalinks).
# - There is no publish job at all: no draft release, no `:latest` move, no
#   LLM notes, no website deploy.
#
# Signing runs exactly like a real release (guards + preflights included) —
# rehearsing the fragile part is half the value of a test build.
#
# Attacker-influenceable values (the computed tag/version) reach `run:` bodies
# only through `env:`, never inline ${{ }} interpolation — same rule as
# release.yml.
name: Test build

on:
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: "Run bin/test-docker against each built arch before pushing"
        type: boolean
        default: true
      build_windows:
        description: "Also build + sign the Windows installer"
        type: boolean
        default: true

permissions:
  contents: read # checkout only — creating a tag or Release is structurally impossible
  packages: write # push the test-tagged backend image to GHCR

# Separate group from the real release ("release"): test builds never contend
# with a publish, and a newer test run on the same ref supersedes the old one.
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Compute the two identifiers and guard them against release collisions:
  # - image_tag: test-<short-sha> — the GHCR tag for the backend image.
  # - app_version: next patch over release.yml's version base (the HIGHER of
  #   the newest v* tag and the committed desktop/package.json floor) +
  #   -test.<run-number> — what the desktop apps are stamped with (valid
  #   semver, unmistakably not a release).
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.compute.outputs.image_tag }} # test-<short-sha>
      app_version: ${{ steps.compute.outputs.app_version }} # X.Y.Z-test.N
      version_tag: ${{ steps.compute.outputs.version_tag }} # test-X.Y.Z-test.N (manifest pin)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need the full tag history to compute the base version

      - name: Compute the test identifiers
        id: compute
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          short_sha="$(git rev-parse --short HEAD)"
          image_tag="test-$short_sha"
          # Same version base as release.yml's prepare: the HIGHER of the
          # newest release tag and the committed desktop/package.json (a
          # 0.0.0 dev sentinel normally, but the floor keeps test builds on
          # the right release line during a planned major/minor bump).
          pkg="$(node -p "require('./desktop/package.json').version")"
          latest_tag="$(git tag --list 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -1)"
          base="$(printf '%s\n%s\n' "${latest_tag:-0.0.0}" "${pkg%%-*}" | sort -V | tail -1)"
          IFS=. read -r MA MI PA <<<"$base"
          app_version="$MA.$MI.$((PA + 1))-test.$GITHUB_RUN_NUMBER"
          # The image is ALSO tagged test-<app_version> and that tag is what the
          # manifest pins — so the in-app badge reads consistently
          # ("app 0.1.4-test.1 · backend test-0.1.4-test.1"). The sha tag
          # stays for traceability back to the commit.
          version_tag="test-$app_version"
          {
            echo "image_tag=$image_tag"
            echo "app_version=$app_version"
            echo "version_tag=$version_tag"
          } >> "$GITHUB_OUTPUT"
          echo "### Test build $app_version (backend image tags: $version_tag + $image_tag, ref: $GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

      # A test tag must NEVER be able to collide with (or be mistaken for) a
      # release tag. The regex alone rules out `latest` and semver, but the
      # explicit checks keep the invariant loud if the tag scheme ever drifts.
      - name: "Guard: test identifiers can never collide with a release"
        env:
          IMAGE_TAG: ${{ steps.compute.outputs.image_tag }}
          APP_VERSION: ${{ steps.compute.outputs.app_version }}
          VERSION_TAG: ${{ steps.compute.outputs.version_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_TAG" =~ ^test-[a-f0-9]{7,}$ ]]; then
            echo "::error::image tag '$IMAGE_TAG' must match ^test-[a-f0-9]{7,}$"; exit 1
          fi
          if [ "$IMAGE_TAG" = "latest" ]; then
            echo "::error::image tag must never be 'latest'"; exit 1
          fi
          if [[ "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::image tag '$IMAGE_TAG' must never look like a release version"; exit 1
          fi
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "::error::app version '$APP_VERSION' must look like X.Y.Z-test.N"; exit 1
          fi
          if ! [[ "$VERSION_TAG" =~ ^test-[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "::error::version tag '$VERSION_TAG' must look like test-X.Y.Z-test.N"; exit 1
          fi
          if [ "$VERSION_TAG" = "latest" ]; then
            echo "::error::version tag must never be 'latest'"; exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build the backend image NATIVELY per architecture — NO QEMU — exactly like
  # release.yml's build-backend, then ALWAYS push each arch by digest (the
  # whole point of a test build is that the image lands on GHCR).
  # ---------------------------------------------------------------------------
  build-backend:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Same headroom reclaim as release.yml: the fat image + its mode=max
      # build cache + the integration Compose stack overflow the runner's
      # ~14GB free without it.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/boost /usr/lib/jvm \
            /opt/hostedtoolcache "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
            2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      # No QEMU emulation here — each arch builds on its own native CPU.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build THIS arch natively; bin/test-docker gates it unless the operator
      # opted out via run_integration_tests. The registry cache uses TEST-OWN
      # per-arch refs (buildcache-test-<arch>), NOT release.yml's shared
      # buildcache-<arch> tags: bin/publish-image's --cache-to mode=max
      # REPLACES the cache tag it writes, so a divergent test branch would
      # evict the warm cache the next real release depends on. publish-image
      # takes a single SYRUS_DOCKER_CACHE_REF (no separate from/to), so the
      # first test build after a cache expiry pays a full cold build — an
      # accepted cost; later test builds are warm again.
      - name: Build (and integration-test) the image — native ${{ matrix.arch }}
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          RUN_TESTS: ${{ inputs.run_integration_tests }}
          SYRUS_DOCKER_REGISTRY_CACHE: "1"
          SYRUS_DOCKER_CACHE_REF: ghcr.io/tkadauke/syrus-backend:buildcache-test-${{ matrix.arch }}
        run: |
          set -euo pipefail
          # The build timestamp is DERIVED FROM THE SOURCE (HEAD's committer
          # date, UTC ISO-8601), never the wall clock — the same deterministic
          # expression release.yml uses, so both matrix legs and the push step
          # below bake the IDENTICAL SYRUS_BUILT_AT into one multi-arch
          # manifest, and the desktop build stamps the same instant
          # (stage-backend-assets.mjs).
          SYRUS_BUILT_AT="$(TZ=UTC git show -s --format=%cd --date=format-local:'%Y-%m-%dT%H:%M:%SZ' HEAD)"
          export SYRUS_BUILT_AT
          args=("$IMAGE_TAG" --no-push)
          if [ "$RUN_TESTS" != "true" ]; then
            echo "::warning::run_integration_tests=false — skipping bin/test-docker for this arch."
            args+=(--skip-tests)
          fi
          bin/publish-image "${args[@]}"

      # ALWAYS push this arch by digest (a tagless manifest) — unlike
      # release.yml there is no dry_run gate; uploading the image is the
      # deterministic outcome this workflow exists for. The build is a cache
      # hit from the step above; the build args must match what
      # bin/publish-image passed or this silently rebuilds a DIFFERENT image
      # than the one the integration gate tested.
      - name: Push ${{ matrix.arch }} by digest
        env:
          IMAGE: ghcr.io/tkadauke/syrus-backend
          PLATFORM: ${{ matrix.platform }}
          CACHE_REF: ghcr.io/tkadauke/syrus-backend:buildcache-test-${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          SYRUS_BUILT_AT="$(TZ=UTC git show -s --format=%cd --date=format-local:'%Y-%m-%dT%H:%M:%SZ' HEAD)"
          docker buildx build -f Dockerfile --target worker-dev \
            --build-arg "GIT_SHA=$(git rev-parse --short HEAD)" \
            --build-arg "SYRUS_VERSION=$VERSION" \
            --build-arg "SYRUS_BUILT_AT=$SYRUS_BUILT_AT" \
            --platform "$PLATFORM" --provenance=false \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json .
          digest="$(jq -r '."containerimage.digest"' /tmp/metadata.json)"
          echo "pushed $PLATFORM as $digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Assemble the per-arch digests into the multi-arch :test-<sha> manifest and
  # verify it is actually pullable. `:latest` is NEVER touched here.
  # ---------------------------------------------------------------------------
  merge-backend:
    needs: [prepare, build-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download per-arch digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Assemble the multi-arch test manifest
        env:
          IMAGE: ghcr.io/tkadauke/syrus-backend
          VERSION: ${{ needs.prepare.outputs.image_tag }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd /tmp/digests
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          if [ "${#refs[@]}" -eq 0 ]; then echo "::error::no per-arch digests to merge"; exit 1; fi
          echo "merging ${#refs[@]} arch(es) into $IMAGE:$VERSION + $IMAGE:$VERSION_TAG"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:$VERSION_TAG" "${refs[@]}"

      - name: Verify the test manifest exists
        env:
          IMAGE: ghcr.io/tkadauke/syrus-backend
          VERSION: ${{ needs.prepare.outputs.image_tag }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          . ./bin/docker-image-lib
          syrus_verify_pushed "$IMAGE" "$VERSION"
          syrus_verify_pushed "$IMAGE" "$VERSION_TAG"

  # ---------------------------------------------------------------------------
  # Cross-compile the CLI tarballs (bin/release-cli: linux/amd64 + arm64 +
  # SHA256SUMS-cli.txt, gated on `go test ./...`) and stage them on the run —
  # the Linux CLI is a shippable component too, so a test build must prove
  # it builds. Unconditional, like release.yml's build-cli.
  # ---------------------------------------------------------------------------
  build-cli:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          # setup-go's default cache lookup expects go.sum at the repo ROOT;
          # ours lives under cli/, so without this the cache step warns and
          # caches nothing on every run.
          cache-dependency-path: cli/go.sum

      - name: Build CLI test tarballs
        env:
          TAG: v${{ needs.prepare.outputs.app_version }}
        run: bin/release-cli "$TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: test-staged-cli
          path: dist/releases/v${{ needs.prepare.outputs.app_version }}/cli/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS: sign + notarize + staple, exactly like a real release, then upload
  # the versioned DMG as a workflow-run artifact. Runs in PARALLEL with the
  # backend (needs: prepare only, same as release.yml) — the manifest pin is a
  # string, not a pull, so the desktop build never needs the image to exist
  # yet; merge-backend pushes it concurrently and it is present by the time the
  # run finishes, which is when you download and install the artifact. If
  # merge-backend fails, the whole run fails and no DMG is delivered.
  # ---------------------------------------------------------------------------
  build-mac:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Signing is REQUIRED for test builds too — rehearsing the fragile part
      # is half the value, and an unsigned DMG is Gatekeeper-blocked anyway.
      - name: "Guard: signing secrets present"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$APPLE_API_KEY_P8" ]]; then
            echo "::error::Signing secrets missing (CSC_LINK / APPLE_API_KEY_P8). A signed build is required — set them in repo secrets (test builds sign too)."
            exit 1
          fi

      # Catch bad Apple credentials in seconds, before the ~15-minute build:
      # decode the p12, check the password, require a "Developer ID Application"
      # cert (an "Apple Development" cert signs then FAILS notarization), refuse
      # expired certs, and prove the notary API key works with a cheap call.
      - name: "Preflight: Apple signing credentials"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/preflight.p12"
          PEM="$RUNNER_TEMP/preflight.pem"
          if ! printf '%s' "$CSC_LINK" | base64 -d > "$P12" 2>/dev/null; then
            echo "::error::CSC_LINK is not valid base64 — re-export with: base64 -i cert.p12 (single line)."
            exit 1
          fi
          if ! openssl pkcs12 -in "$P12" -nokeys -passin env:CSC_KEY_PASSWORD -out "$PEM" 2>/dev/null; then
            if ! openssl pkcs12 -in "$P12" -nokeys -legacy -passin env:CSC_KEY_PASSWORD -out "$PEM" 2>/dev/null; then
              echo "::error::Could not open the p12 with CSC_KEY_PASSWORD — wrong password or corrupted p12."
              exit 1
            fi
          fi
          SUBJECT=$(openssl x509 -in "$PEM" -noout -subject)
          echo "cert subject: $SUBJECT"
          if ! grep -q "Developer ID Application" <<<"$SUBJECT"; then
            echo "::error::CSC_LINK is not a 'Developer ID Application' certificate ($SUBJECT). Apple Development / Distribution certs sign locally but FAIL notarization."
            exit 1
          fi
          if ! openssl x509 -in "$PEM" -noout -checkend 0; then
            echo "::error::The Developer ID certificate has EXPIRED. Create a new one and update CSC_LINK/CSC_KEY_PASSWORD."
            exit 1
          fi
          if ! openssl x509 -in "$PEM" -noout -checkend 2592000; then
            echo "::warning::The Developer ID certificate expires within 30 days — rotate CSC_LINK soon."
          fi
          rm -f "$P12" "$PEM"
          if [[ ! "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_API_KEY_ID doesn't look like a 10-character key id — is it swapped with APPLE_API_ISSUER?"
            exit 1
          fi
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::APPLE_API_ISSUER doesn't look like a UUID — is it swapped with APPLE_API_KEY_ID?"
            exit 1
          fi
          KEY="$RUNNER_TEMP/preflight_key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY"
          if ! xcrun notarytool history --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json > /dev/null; then
            echo "::error::notarytool rejected the App Store Connect API key. It must be a TEAM key with the Developer role."
            exit 1
          fi
          rm -f "$KEY"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The desktop build cross-compiles the Syrus CLI into the app bundle
      # (desktop/scripts/stage-cli.mjs); macos-15 runners ship NO Go, and
      # stage-cli hard-fails without it under SYRUS_RELEASE_BUILD=1.
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          # setup-go's default cache lookup expects go.sum at the repo ROOT;
          # ours lives under cli/, so without this the cache step warns and
          # caches nothing on every run.
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: npm ci --prefix desktop

      # Stamp the -test. version so the produced app can never be mistaken
      # for a release — and so the app's own updater guard (appUpdates.ts
      # skips auto-update for -test. versions) keeps the pinned test install
      # from replacing itself with the next published release.
      - name: Set version
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
        run: npm --prefix desktop version "$VERSION" --no-git-tag-version --allow-same-version

      # notarytool needs the App Store Connect API key (a .p8 secret) as a file.
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"

      # SYRUS_BACKEND_IMAGE overrides the manifest pin (stage-backend-assets.mjs)
      # so the installer pulls the test-tagged image merge-backend just pushed —
      # without it, SYRUS_RELEASE_BUILD=1 would pin :<app_version>, a tag that
      # does not exist. Same forceCodeSigning + retry-once policy as release.yml.
      - name: Build, sign, and notarize
        timeout-minutes: 60
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SYRUS_RELEASE_BUILD: "1"
          SYRUS_BACKEND_IMAGE: ghcr.io/tkadauke/syrus-backend:${{ needs.prepare.outputs.version_tag }}
        run: |
          set -o pipefail
          build() {
            npm --prefix desktop run build -- --publish never -c.forceCodeSigning=true 2>&1 | tee "$RUNNER_TEMP/build.log"
          }
          if build; then exit 0; fi
          if grep -q '"status":"Invalid"\|status: Invalid' "$RUNNER_TEMP/build.log"; then
            echo "::error::Notarization verdict was Invalid — deterministic, not retrying. See the developer log artifact."
            exit 1
          fi
          # stage-cli.mjs hard-fails under SYRUS_RELEASE_BUILD=1 when the Go
          # toolchain is missing — deterministic, a retry cannot fix it.
          if grep -qF 'stage-cli: Go toolchain not found' "$RUNNER_TEMP/build.log"; then
            echo "::error::stage-cli hard-failed: no Go toolchain on the runner — deterministic, not retrying. Fix the actions/setup-go step (go-version-file: cli/go.mod)."
            exit 1
          fi
          echo "::warning::Build/notarization failed with a non-deterministic error — retrying once in 90s."
          sleep 90
          build

      - name: Fetch notarytool developer log
        if: failure()
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ID=$(grep -oE '"id"[[:space:]]*:[[:space:]]*"[0-9a-f-]{36}"' "$RUNNER_TEMP/build.log" | tail -1 | grep -oE '[0-9a-f-]{36}') || true
          if [[ -n "${ID:-}" ]]; then
            xcrun notarytool log "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" "$RUNNER_TEMP/notary_developer_log.json" || true
          fi
          cp "$RUNNER_TEMP/build.log" . 2>/dev/null || true
          cp "$RUNNER_TEMP/notary_developer_log.json" . 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-mac-diagnostics
          path: |
            build.log
            notary_developer_log.json
          if-no-files-found: ignore
          retention-days: 14

      # stapler runs against the .app — the DMG container carries no ticket of
      # its own. The manifest check is what makes "the backend tag is
      # manifested in" deterministic instead of assumed.
      - name: Verify signature, notarization, and the backend manifest pin
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
          BACKEND_IMAGE: ghcr.io/tkadauke/syrus-backend:${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          APP="desktop/out/mac-universal/Syrus.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep "Developer ID Application"
          spctl -a -t exec -vv "$APP" 2>&1 | grep "Notarized Developer ID"
          xcrun stapler validate "$APP"
          test -f "desktop/out/Syrus-$VERSION-universal.dmg"
          # The bundled CLI must be INSIDE the built app (both darwin arches
          # ride the universal app; ensureCliCurrent installs the matching one).
          test -x "$APP/Contents/Resources/cli/syrus-darwin-arm64"
          test -x "$APP/Contents/Resources/cli/syrus-darwin-x64"
          # The sealed manifest must pin the test image tag this run pushed.
          grep -qF "\"image\": \"$BACKEND_IMAGE\"" "$APP/Contents/Resources/backend/manifest.json"

      # Stage ONLY the versioned DMG. Deliberately no stable "Syrus.dmg"
      # alias — that name is the website permalink and belongs to releases —
      # and no auto-update feed files (latest-mac.yml / .zip): a test build
      # must never feed the update channel.
      - name: Stage macOS test artifact
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staged"
          cp "desktop/out/Syrus-$VERSION-universal.dmg" "$RUNNER_TEMP/staged/"

      - uses: actions/upload-artifact@v7
        with:
          name: test-staged-mac
          path: ${{ runner.temp }}/staged/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows: Azure Trusted Signing, exactly like a real release, then upload
  # the versioned installer as a workflow-run artifact. Skippable via the
  # build_windows input. Runs in parallel with the backend, same as build-mac.
  # ---------------------------------------------------------------------------
  build-windows:
    needs: prepare
    if: inputs.build_windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: "Guard: Azure signing configuration present"
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT || vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT_NAME: ${{ secrets.AZURE_SIGN_ACCOUNT_NAME || vars.AZURE_SIGN_ACCOUNT_NAME }}
          AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE || vars.AZURE_SIGN_CERT_PROFILE }}
          AZURE_SIGN_PUBLISHER_NAME: ${{ secrets.AZURE_SIGN_PUBLISHER_NAME || vars.AZURE_SIGN_PUBLISHER_NAME }}
        run: |
          missing=()
          for var in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT_NAME AZURE_SIGN_CERT_PROFILE AZURE_SIGN_PUBLISHER_NAME; do
            if [ -z "${!var}" ]; then missing+=("$var"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Azure signing configuration missing: ${missing[*]} — see docs/windows-signing.md. A signed build is required — set them in repo secrets/variables (test builds sign too)."
            exit 1
          fi

      # A 401 here is a credential problem; a 403 later at sign time is a
      # role/profile problem (different fixes — see the runbook).
      - name: "Preflight: Azure credentials"
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $body = @{
            grant_type    = "client_credentials"
            client_id     = $env:AZURE_CLIENT_ID
            client_secret = $env:AZURE_CLIENT_SECRET
            scope         = "https://codesigning.azure.net/.default"
          }
          try {
            $null = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$($env:AZURE_TENANT_ID)/oauth2/v2.0/token" -Body $body
            Write-Host "Azure token acquisition OK"
          } catch {
            Write-Host "::error::Azure credential preflight failed: $($_.Exception.Message). Check AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET (single-tenant app registration; secrets expire)."
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Pin Go for the bundled CLI — parity with build-mac and determinism
      # over runner-image drift (stage-cli.mjs hard-fails without it under
      # SYRUS_RELEASE_BUILD=1).
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          # setup-go's default cache lookup expects go.sum at the repo ROOT;
          # ours lives under cli/, so without this the cache step warns and
          # caches nothing on every run.
          cache-dependency-path: cli/go.sum

      - name: Install dependencies
        run: npm ci --prefix desktop

      - name: Set version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
        run: npm --prefix desktop version "$VERSION" --no-git-tag-version --allow-same-version

      # electron-builder installs the TrustedSigning module on first use; do it
      # once here (with retries) to dodge transient gallery failures.
      - name: "Preflight: TrustedSigning module"
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          $attempts = 0
          while ($true) {
            try {
              Install-Module -Name TrustedSigning -Force -Scope CurrentUser -ErrorAction Stop
              break
            } catch {
              $attempts += 1
              if ($attempts -ge 3) { Write-Host "::error::Could not install the TrustedSigning module: $($_.Exception.Message)"; exit 1 }
              Start-Sleep -Seconds 20
            }
          }

      # win.azureSignOptions is intentionally NOT in the checked-in
      # electron-builder.yml; inject it here, only in a job that has the
      # credentials. SYRUS_BACKEND_IMAGE pins the test image tag into the
      # installer's manifest.json (see build-mac's comment).
      - name: Build and sign
        timeout-minutes: 45
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT || vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT_NAME: ${{ secrets.AZURE_SIGN_ACCOUNT_NAME || vars.AZURE_SIGN_ACCOUNT_NAME }}
          AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE || vars.AZURE_SIGN_CERT_PROFILE }}
          AZURE_SIGN_PUBLISHER_NAME: ${{ secrets.AZURE_SIGN_PUBLISHER_NAME || vars.AZURE_SIGN_PUBLISHER_NAME }}
          SYRUS_RELEASE_BUILD: "1"
          SYRUS_BACKEND_IMAGE: ghcr.io/tkadauke/syrus-backend:${{ needs.prepare.outputs.version_tag }}
        run: |
          AZURE_SIGN_ENDPOINT="${AZURE_SIGN_ENDPOINT%/}"
          npm --prefix desktop run build -- --win --publish never \
            -c.forceCodeSigning=true \
            "-c.win.azureSignOptions.publisherName=${AZURE_SIGN_PUBLISHER_NAME}" \
            "-c.win.azureSignOptions.endpoint=${AZURE_SIGN_ENDPOINT}" \
            "-c.win.azureSignOptions.certificateProfileName=${AZURE_SIGN_CERT_PROFILE}" \
            "-c.win.azureSignOptions.codeSigningAccountName=${AZURE_SIGN_ACCOUNT_NAME}"

      - name: Verify signatures and the backend manifest pin
        shell: pwsh
        env:
          BACKEND_IMAGE: ghcr.io/tkadauke/syrus-backend:${{ needs.prepare.outputs.version_tag }}
        run: |
          $exes = Get-ChildItem -Path desktop/out -Filter "Syrus-Setup-*.exe"
          if ($exes.Count -eq 0) { throw "No Syrus-Setup-*.exe artifacts found under desktop/out" }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "$($exe.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne "Valid") { throw "$($exe.Name) is not validly signed (status: $($sig.Status))" }
          }
          # The bundled CLI must be in the packaged resources (win-unpacked is
          # what NSIS wraps).
          if (-not (Test-Path "desktop/out/win-unpacked/resources/cli/syrus-win32-x64.exe")) { throw "Bundled CLI missing - desktop/out/win-unpacked/resources/cli/syrus-win32-x64.exe not found (stage-cli must have been skipped)" }
          # The sealed manifest must pin the test image tag this run pushed.
          $manifest = Get-Content "desktop/out/win-unpacked/resources/backend/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.image -ne $env:BACKEND_IMAGE) { throw "manifest.json pins '$($manifest.image)' instead of '$($env:BACKEND_IMAGE)'" }

      # Stage ONLY the versioned installer. No stable "Syrus-Setup.exe" alias
      # (the website permalink belongs to releases) and no latest.yml — a test
      # build must never feed the update channel.
      - name: Stage Windows test artifact
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staged"
          cp "desktop/out/Syrus-Setup-$VERSION-x64.exe" "$RUNNER_TEMP/staged/"

      - uses: actions/upload-artifact@v7
        with:
          name: test-staged-windows
          path: ${{ runner.temp }}/staged/
          if-no-files-found: error
          retention-days: 14
