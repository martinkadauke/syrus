<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The floating recording HUD: a small always-on-top panel the user can
         DRAG anywhere on screen (including off the surface being demonstrated),
         so the recording controls are always reachable without switching back
         to the Syrus window. State is pushed in over IPC (window.__recorderHud
         from recorderHudPreload); Stop / Discard / the pen toggle send actions
         back. The whole panel is a drag region except the buttons.

         The panel is RECTANGULAR on purpose: rounded corners on a transparent
         always-on-top window render with visible compositing artifacts on
         macOS, so this matches the web app's bordered-white-panel look
         instead. After every render the script measures the panel and asks
         main to size the WINDOW to the content (recorderHud:resize), so text
         is never truncated no matter the locale. -->
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        user-select: none;
        cursor: default;
      }
      .pill {
        -webkit-app-region: drag;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        margin: 8px;
        background: #ffffff;
        border: 1px solid #d1d5db;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        color: #111827;
        white-space: nowrap;
      }
      @media (prefers-color-scheme: dark) {
        .pill { background: #111827; border-color: rgba(255, 255, 255, 0.16); color: #f3f4f6; }
      }
      .dot { position: relative; width: 12px; height: 12px; flex: none; }
      .dot::before, .dot::after {
        content: ""; position: absolute; inset: 0; border-radius: 9999px; background: #dc2626;
      }
      .dot::before { animation: ping 1.2s cubic-bezier(0,0,0.2,1) infinite; opacity: 0.75; }
      @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
      .clock { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .remaining { font-size: 12px; font-variant-numeric: tabular-nums; color: #6b7280; }
      .remaining.warn { color: #d97706; font-weight: 600; }
      @media (prefers-color-scheme: dark) { .remaining { color: #9ca3af; } .remaining.warn { color: #fbbf24; } }
      .nomic { font-size: 12px; color: #d97706; }
      @media (prefers-color-scheme: dark) { .nomic { color: #fbbf24; } }
      /* The pen state: a tiny neutral dot + short muted text while idle, a red
         dot while drawing. Deliberately quiet — the old bright-red 600-weight
         hint shouted over the whole HUD. */
      .penstatus { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #6b7280; }
      @media (prefers-color-scheme: dark) { .penstatus { color: #9ca3af; } }
      .pendot { width: 6px; height: 6px; flex: none; border-radius: 9999px; background: #9ca3af; }
      .penstatus.drawing .pendot { background: #dc2626; }
      button {
        -webkit-app-region: no-drag;
        border: 0; border-radius: 4px; cursor: pointer; font-weight: 600;
        font-size: 12px; padding: 5px 12px;
      }
      button.stop { background: #dc2626; color: #fff; }
      button.stop:hover { background: #b91c1c; }
      button.discard { background: transparent; color: #6b7280; padding: 5px 8px; }
      button.discard:hover { background: rgba(0,0,0,0.06); color: #374151; }
      @media (prefers-color-scheme: dark) { button.discard { color: #9ca3af; } button.discard:hover { background: rgba(255,255,255,0.08); color: #e5e7eb; } }
      /* The mouse-only pen toggle: a restrained icon button, active while the
         pen is armed. Works with no keyboard at all — the fallback when the
         native hold hook / Accessibility permission is unavailable. */
      button.pen {
        background: transparent; border: 1px solid transparent; color: #6b7280;
        padding: 3px 7px; font-size: 13px; line-height: 1;
      }
      button.pen:hover { background: rgba(0,0,0,0.06); }
      button.pen.active { background: rgba(220, 38, 38, 0.12); border-color: #dc2626; }
      @media (prefers-color-scheme: dark) {
        button.pen { color: #9ca3af; }
        button.pen:hover { background: rgba(255,255,255,0.08); }
        button.pen.active { background: rgba(220, 38, 38, 0.25); }
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="pill" id="pill" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span class="clock" id="clock">0:00</span>
      <span class="remaining" id="remaining"></span>
      <span class="nomic hidden" id="nomic"></span>
      <span class="penstatus hidden" id="penstatus">
        <span class="pendot" aria-hidden="true"></span>
        <span id="hint"></span>
      </span>
      <button class="pen hidden" id="pen" type="button" aria-label="Toggle drawing" aria-pressed="false">&#x270F;&#xFE0F;</button>
      <button class="stop" id="stop" type="button">Stop &amp; attach</button>
      <button class="discard" id="discard" type="button">Discard</button>
    </div>
    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        function set(id, text) { var el = $(id); if (el) el.textContent = text; }
        function toggle(id, on) { var el = $(id); if (el) el.classList.toggle("hidden", !on); }

        $("stop").addEventListener("click", function () { window.__recorderHud && window.__recorderHud.action("stop"); });
        $("discard").addEventListener("click", function () { window.__recorderHud && window.__recorderHud.action("discard"); });
        $("pen").addEventListener("click", function () { window.__recorderHud && window.__recorderHud.action("pen"); });

        // Ask main to size the WINDOW to the panel so no locale's text is ever
        // clipped by the old fixed 480px width. Measured a frame after render
        // so layout has settled; +16 covers the panel's 8px margins.
        function sendSize() {
          if (!(window.__recorderHud && window.__recorderHud.resize)) return;
          var pill = $("pill");
          window.__recorderHud.resize({
            width: Math.ceil(pill.offsetWidth) + 16,
            height: Math.ceil(pill.offsetHeight) + 16
          });
        }

        // Updates MERGE into the last-known state instead of replacing it:
        // main pushes tiny partial updates (e.g. { drawing } straight from the
        // overlay's mode change) between the recorder's full-state ticks, and a
        // partial update must not blank the clock or the hint.
        var current = {};
        function render() {
          set("clock", current.clock || "0:00");
          set("remaining", current.remaining || "");
          toggle("remaining", !!current.remaining);
          if (current.remainingWarn) $("remaining").classList.add("warn"); else $("remaining").classList.remove("warn");
          set("nomic", current.noMic || "");
          toggle("nomic", !!current.noMic);
          var hint = current.hint || "";
          set("hint", hint);
          // The hint doubles as the annotation-availability signal: no hint
          // means no live overlay, so the pen state AND the pen button hide
          // together (never advertise a dead affordance).
          toggle("penstatus", !!hint);
          toggle("pen", !!hint);
          if (current.drawing) $("penstatus").classList.add("drawing"); else $("penstatus").classList.remove("drawing");
          if (current.drawing) $("pen").classList.add("active"); else $("pen").classList.remove("active");
          $("pen").setAttribute("aria-pressed", current.drawing ? "true" : "false");
          $("pen").setAttribute("aria-label", current.penLabel || "Toggle drawing");
          set("stop", current.stopLabel || "Stop & attach");
          set("discard", current.discardLabel || "Discard");
          requestAnimationFrame(sendSize);
        }

        if (window.__recorderHud && window.__recorderHud.onUpdate) {
          window.__recorderHud.onUpdate(function (state) {
            state = state || {};
            for (var key in state) {
              if (Object.prototype.hasOwnProperty.call(state, key)) current[key] = state[key];
            }
            render();
          });
        }
      })();
    </script>
  </body>
</html>
